; Processos do container. O worker de fila e o agendador são ligados pelas
; variáveis IN_QUEUE_WORKER / IN_SCHEDULER (o entrypoint define false por padrão).
; ATENÇÃO: só pode existir UM agendador por banco de dados, senão as faturas
; recorrentes são geradas em duplicidade.

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=1 --memory=256 --timeout=3600
user=www-data
autostart=%(ENV_IN_QUEUE_WORKER)s
autorestart=true
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=%(ENV_IN_SCHEDULER)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
